name: Daily Adzuna Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pandas psycopg2-binary

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CLOUD_DB_HOST: ${{ secrets.CLOUD_DB_HOST }}
          CLOUD_DB_PORT: ${{ secrets.CLOUD_DB_PORT }}
          CLOUD_DB_NAME: ${{ secrets.CLOUD_DB_NAME }}
          CLOUD_DB_USER: ${{ secrets.CLOUD_DB_USER }}
          CLOUD_DB_PASSWORD: ${{ secrets.CLOUD_DB_PASSWORD }}
        run: |
          python src/pipeline.py