name: Daily Adzuna Collection

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run collector
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python src/collector.py

      - name: Get collection date
        id: date
        run: |
          echo "date=$(TZ=Europe/Warsaw date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Upload raw snapshot
        uses: actions/upload-artifact@v4
        with:
          name: adzuna-raw-${{ steps.date.outputs.date }}
          path: data/raw/${{ steps.date.outputs.date }}/
          retention-days: 30